name: tests

# CARLA-free verification: bridge integration tests against FakeCarlaScenario
# plus unit tests. Real CARLA / OpenClaw / Discord system tests are not run here.
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10"]  # only version verified locally
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Syntax check (bridge, tools, tests)
        run: python -m compileall -q bridge tools tests
      - name: Unit tests
        run: python -m pytest tests/unit -v
      - name: Integration tests (FakeCarlaScenario)
        run: python -m pytest tests/integration -v
